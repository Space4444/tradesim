<!doctype html>
<html>
  <head>
	<link rel="stylesheet" href="css/bootstrap4-neon-glow.min.css">
	<link rel="stylesheet" href="css/style.css">

	<link rel="icon" type="image/x-icon" href="img/icon.webp?r=34547" />
	<link rel="shortcut icon" type="image/x-icon" href="img/icon.webp?r=34547" />
    
	<title>Scalpingator</title>
  </head>
  <body>
	<div id="contextMenu" class="bg-dark" style="display:none">
		<form class="range-field w-75">
			<input id="qtySlider" class="border-0" type="range" value="0">
		</form>
		<div class="input-group mb-3">
			<input id="qtyInput" type="number" class="form-control" placeholder="size" max="10000000" min="1">
			<div class="input-group-append">
				<span id="baseSpan" class="input-group-text"></span>
			</div>
		</div>
		<div class="input-group mb-3">
			<input id="priceInput" type="number" class="form-control" placeholder="price" min="0" step="0.00001">
		</div>
		<button class="btn btn-success" onclick="window.buyLimit()">Buy Limit</button>
		<button class="btn btn-danger" onclick="window.sellLimit()">Sell Limit</button>
		<br>
		<br>
		<button class="btn btn-success" onclick="window.buyStop()">Buy Stop</button>
		<button class="btn btn-danger" onclick="window.sellStop()">Sell Stop</button>
		<br>
		<br>
		<button class="btn btn-info" onclick="window.addLevel()">Add level</button>
	</div>
    <div class="container-fullwidth">
		<div class="row" id="row">
			<div class="col-12">
				<form onsubmit="return false" action="#" method="">
					<fieldset>
						<div id="info" class="row" style="display:none">
							<div id="posDiv" class="form-group col-4">
								<div class="row bg-dark">
									<div class="form-group col-12 topRow">Position</div>
								</div>
								<div class="row">
									<div class="form-group col-12">
										<div class="row secondRow">
											<div class="form-group right col-6">Size</div><div id="posSize" class="form-group left col-6">0</div>
										</div>
										<div class="row">
											<div class="form-group right col-6">Entry</div><div id="posEntry" class="form-group left col-6">-</div>
										</div>
										<div class="row">
											<div class="form-group right col-6">P&L</div><div id="posPNL" class="form-group left col-6">-</div>
										</div>
										<div class="row">
											<div class="form-group right col-6">Liquidation</div><div id="posLiq" class="form-group left col-6">-</div>
										</div>
										<div class="row">
											<div id="posCloseBtn" class="form-group col-12 btn btn-danger btn-sm" style="display:none" onclick="window.closePos();">Close</div>
										</div>
									</div>
								</div>
							</div>
							<div id="ordDiv" class="form-group col-8">
								<div class="row bg-dark">
									<div class="form-group col-12 topRow">Orders</div>
								</div>
								<div class="row">
									<div id="ordersDiv" class="form-group col-12 scrollbar-primary">
										<div class="row secondRow">
											<div class="form-group col-3">Type</div>
											<div class="form-group col-4">Size</div>
											<div class="form-group col-4">Price</div>
											<div class="form-group col-1"></div>
										</div>
									</div>
								</div>
							</div>
						</div>
						<div id="menu">
							<h1 class="text-dark">ScalpingatoR</h1>
							<br>
							<div class="row">
								<div class="form-group col-6 right">Record ROE</div>
								<div id="recordROEdiv" class="form-group col-6 left"></div>
							</div>
							<div class="row">
								<div class="form-group col-6 right">Record PNL</div>
								<div class="form-group col-6 left"><span id="recordPNLspan"></span><img src="img/coin.png"></img></div>
							</div>
							<div class="row">
								<div class="form-group col-6 right">All Time ROE</div>
								<div id="allTimeROEdiv" class="form-group col-6 left"></div>
							</div>
							<div class="row">
								<div class="form-group col-6 right">All Time PNL</div>
								<div class="form-group col-6 left"><span id="allTimePNLspan"></span><img src="img/coin.png"></img></div>
							</div>
							<div class="row">
								<div class="form-group col-6 right">Deposits</div>
								<div class="form-group col-6 left"><span id="depositsSpan"></span><img src="img/coin.png"></img></div>
							</div>
							<button id="playBtn" class="btn btn-success btn-lg" onclick="window.play&&window.play()" type="button">Start</button>
						</div>
						<div id="loading" class="text-info" style="display:none">
                            Loading............
                            <br>
                            <progress id="loadBar" value="0"></progress>
                        </div>
					</fieldset>
				</form>
			</div>
		</div>
	</div>
	<div id="gameBtns" style="display:none">
		<form class="range-field w-75">
			<input id="slider" class="border-0" type="range">
		</form>
		<button id="resumeBtn" class="btn btn-info btn-sm" type="button" title="play">▶️</button>
		<button id="pauseBtn" class="btn btn-info btn-sm" style="display:none" type="button" title="pause"><b>| |</b></button>
		<button id="exitBtn" class="btn btn-danger btn-sm" type="button" onclick="location.reload()" title="exit"><img src="img/exit.png"></img></button>
	</div>
	<div id="balanceDiv" style="display:none" title="balance">
		<div id="withdrawDiv"><button class="btn btn-success btn-sm" type="button" title="withdraw"><img src="img/withdraw.png"></img></button></div>
		<div id="balanceText" style="display:inline-block"></div>
	</div>
	<div id="riskDiv" style="display:none">
		<div class="input-group mb-3">
			<div class="form-control bg-secondary text-dark">Steps:</div>
			<input id="stepsInput" type="number" class="form-control" placeholder="steps" value="1" min="1" max="100" step="1">
			<div class="form-control bg-secondary text-dark">Risk:</div>
			<input id="riskInput" type="number" class="form-control" placeholder="risk, %" value="10" min="0" max="100">
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/popper.js@1.14.6/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
	<script src="js/anychart-bundle.min.js"></script>
	<script src="js/dukascopy_metadata.js"></script>
	<script src="js/dukascopy.js"></script>
	<script src="js/symbols.js"></script>
	<script src="js/trading.js"></script>
	<script src="js/client.js"></script>
	<script src="js/bot.js"></script>
  </body>
</html>
